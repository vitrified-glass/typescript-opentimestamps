name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # for npm trusted publishing (OIDC)

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # `npm stage publish` needs npm >= 11.15; pin it rather than rely on the
      # npm bundled with whichever Node 24 the runner resolves.
      - name: Pin npm
        run: npm install --global npm@11.19.1

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag '${GITHUB_REF_NAME}' does not match package.json version '${PKG_VERSION}'"
            exit 1
          fi

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # Stage only: the version goes live when a maintainer approves it with 2FA
      # (`npm stage approve <stage-id>` or the package's Staged Packages tab).
      - name: Stage publish
        run: npm stage publish . --access public --provenance
